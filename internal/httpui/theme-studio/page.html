<article class="studio-article"><header><p class="kicker">{{if eq .Kind "post"}}Проект{{if .PublishedAt}} / {{date .PublishedAt}}{{end}}{{else if .Search}}Поиск по сайту{{else}}Подробнее{{end}}</p><h1>{{.Title}}</h1>{{if .Description}}<p class="studio-deck">{{.Description}}</p>{{end}}</header>{{if .Cover}}<figure><img src="{{cover .Slug .Cover}}" alt=""></figure>{{end}}<div class="article-content">{{.Body}}</div>{{if .PostTerms}}<nav class="studio-tags">{{range .PostTerms}}<a href="/?term={{.ID}}">{{.Name}}</a>{{end}}</nav>{{end}}</article>
