<article class="page-article article-page"><header class="article-heading"><p class="eyebrow">{{.Site.Title}}</p><h1>{{.Title}}</h1>{{if .Description}}<p class="article-deck">{{.Description}}</p>{{end}}</header>{{if .Cover}}<figure class="page-cover"><img src="{{cover .Slug .Cover}}" alt="" width="1440" height="1080" fetchpriority="high"></figure>{{end}}<div class="article-content page-content">{{.Body}}</div></article>
