{{if or .Pagination.PreviousURL .Pagination.NextURL}}
<nav class="blog-pagination" aria-label="Страницы журнала">
{{if .Pagination.PreviousURL}}<a href="{{.Pagination.PreviousURL}}#journal"><span aria-hidden="true">←</span> Назад</a>{{else}}<span></span>{{end}}
<span class="page-indicator">{{.Pagination.Current}} <span>/</span> {{.Pagination.TotalPages}}</span>
{{if .Pagination.NextURL}}<a href="{{.Pagination.NextURL}}#journal">Далее {{template "icon-arrow"}}</a>{{else}}<span></span>{{end}}
</nav>{{end}}
