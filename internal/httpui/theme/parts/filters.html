<div class="journal-toolbar"><div class="journal-section-title"><h2 id="journal-title">{{with .ActiveTerm}}{{.Name}}{{else}}{{if .Archive}}Все истории{{else}}Свежий взгляд{{end}}{{end}}</h2><span class="journal-count">{{postCount .BlogTotal}}</span></div>
<nav class="blog-filters" aria-label="Категории"><a href="/#journal" {{if not .BlogTerm}}aria-current="page"{{end}}>Все записи</a>{{range .Categories}}<a href="/?term={{.ID}}#journal" {{if eq $.BlogTerm .ID}}aria-current="page"{{end}}>{{.Name}}</a>{{end}}{{with .ActiveTerm}}{{if eq .Kind "tag"}}<a href="/?term={{.ID}}#journal" aria-current="page">#{{.Name}}</a>{{end}}{{end}}</nav></div>
