<div class="journal-toolbar">
<nav class="blog-filters" aria-label="{{tr "Категории"}}">
<a href="{{siteURL "/"}}#journal" {{if not .BlogTerm}}aria-current="page"{{end}}>{{tr "Все публикации"}}</a>
{{range .Categories}}<a href="{{siteURL (printf "/?term=%d" .ID)}}#journal" {{if eq $.BlogTerm .ID}}aria-current="page"{{end}}>{{.Name}}</a>{{end}}
{{with .ActiveTerm}}{{if eq .Kind "tag"}}<a href="{{siteURL (printf "/?term=%d" .ID)}}#journal" aria-current="page">#{{.Name}}</a>{{end}}{{end}}
</nav>
<div class="journal-section-title">
<h2 id="journal-title" class="sr-only">{{with .ActiveTerm}}{{.Name}}{{else}}{{if .Archive}}{{tr "Все истории"}}{{else}}{{tr "Журнал"}}{{end}}{{end}}</h2>
<span class="journal-count">{{postCount .BlogTotal}}</span>
</div>
</div>
