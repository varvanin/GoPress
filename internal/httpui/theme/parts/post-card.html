<article class="post-card">
<div class="post-card-body">
<div class="story-meta"><span class="category-pill-sm">{{with .Category}}{{.Name}}{{else}}Блог{{end}}</span><time datetime="{{isoDate .PublishedAt}}">{{date .PublishedAt}}</time></div>
<h3><a href="{{contentURL .Slug .URL}}">{{.Title}}</a></h3>
{{if .SEO.Description}}<p class="story-description">{{.SEO.Description}}</p>{{end}}
<span class="reading-meta">5 мин чтения · Редакция</span>
</div>
<a class="cover-link" href="{{contentURL .Slug .URL}}" aria-label="Читать: {{.Title}}"><img src="{{journalCover .Slug .Cover}}" alt="" width="360" height="270" loading="lazy" decoding="async"></a>
</article>
{{define "post-card"}}{{template "parts/post-card" .}}{{end}}
