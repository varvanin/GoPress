<header class="site-header">
<a class="site-brand" href="/" aria-label="{{.Site.Title}} — главная"><span>{{.Site.Title}}</span></a>
<nav class="public-nav header-desktop" aria-label="Основная навигация">{{template "header-links" .}}</nav>
<div class="header-utilities">
<a class="header-search" href="/search" aria-label="Поиск по журналу">{{template "icon-search"}}<span>Поиск</span></a>
{{if .SEO.RSS}}<a class="header-rss" href="/rss.xml">{{template "icon-rss"}}<span>RSS</span></a>{{end}}
<details class="mobile-nav"><summary aria-label="Открыть меню">{{template "icon-menu"}}</summary><nav aria-label="Мобильная навигация">{{template "header-links" .}}</nav></details>
</div>
</header>
