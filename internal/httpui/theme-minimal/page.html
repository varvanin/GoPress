<article class="minimal-article minimal-page"><header class="minimal-article-heading"><p class="minimal-kicker">{{.Site.Title}}</p><h1>{{.Title}}</h1>{{if .Description}}<p class="minimal-description">{{.Description}}</p>{{end}}</header>{{if .Cover}}<figure class="minimal-cover"><img src="{{cover .Slug .Cover}}" alt="" width="1440" height="960" fetchpriority="high"></figure>{{end}}<div class="minimal-reading article-content">{{.Body}}</div></article>
