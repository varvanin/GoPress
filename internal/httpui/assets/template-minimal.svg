<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect x="0" y="0" width="1280" height="800" rx="0" fill="#fbfbf9"/><rect x="56" y="52" width="38" height="38" rx="3" fill="none"/><rect x="56" y="52" width="38" height="38" rx="3" fill="none" stroke="#20251f"/><text x="68" y="78" font-family="Arial" font-size="18" font-weight="400" fill="#20251f">Т</text><text x="106" y="76" font-family="Arial" font-size="19" font-weight="600" fill="#20251f">Тихие заметки</text><text x="56" y="127" font-family="Arial" font-size="12" font-weight="400" fill="#646c61">Записи, идеи и наблюдения.</text><text x="56" y="149" font-family="Arial" font-size="12" font-weight="400" fill="#646c61">Место для главного.</text><path d="M275 52h0" stroke="#dfe2d9"/><path d="M275 52v340" stroke="#dfe2d9"/><text x="56" y="219" font-family="Arial" font-size="13" font-weight="600" fill="#92513c">Записи</text><text x="56" y="256" font-family="Arial" font-size="13" font-weight="400" fill="#20251f">О журнале</text><path d="M56 300h192" stroke="#dfe2d9"/><text x="56" y="337" font-family="Arial" font-size="12" font-weight="400" fill="#646c61">⌕  Поиск по сайту</text><text x="56" y="370" font-family="Arial" font-size="12" font-weight="400" fill="#646c61">↗  Читать через RSS</text><text x="356" y="65" font-family="Arial" font-size="11" font-weight="400" fill="#92513c">ЛИЧНЫЙ ЖУРНАЛ</text><text x="352" y="144" font-family="Arial" font-size="58" font-weight="600" fill="#20251f">Пространство</text><text x="352" y="208" font-family="Arial" font-size="58" font-weight="600" fill="#20251f">для мыслей.</text><text x="356" y="260" font-family="Arial" font-size="16" font-weight="400" fill="#646c61">Наблюдения, открытия и опыт, которым хочется поделиться.</text><text x="356" y="291" font-family="Arial" font-size="16" font-weight="400" fill="#646c61">Без спешки и лишнего шума.</text><text x="356" y="362" font-family="Arial" font-size="13" font-weight="600" fill="#20251f">Последние записи</text><text x="1144" y="362" font-family="Arial" font-size="11" font-weight="400" fill="#646c61">10 записей</text><path d="M356 381h868" stroke="#20251f"/><text x="356" y="416" font-family="Arial" font-size="11" font-weight="400" fill="#646c61">Все записи     Дизайн     Культура     Практика</text><path d="M356 442h868" stroke="#dfe2d9"/><text x="356" y="490" font-family="Arial" font-size="12" font-weight="400" fill="#646c61">27.10.2026</text><text x="356" y="515" font-family="Arial" font-size="11" font-weight="400" fill="#92513c">Наблюдения</text><text x="496" y="494" font-family="Arial" font-size="29" font-weight="400" fill="#20251f">Искусство делать паузу</text><text x="1196" y="492" font-family="Arial" font-size="20" font-weight="400" fill="#646c61">→</text><text x="496" y="533" font-family="Arial" font-size="14" font-weight="400" fill="#646c61">Почему свободное время — часть творческого процесса.</text><path d="M356 581h868" stroke="#dfe2d9"/><text x="356" y="630" font-family="Arial" font-size="12" font-weight="400" fill="#646c61">26.10.2026</text><text x="356" y="655" font-family="Arial" font-size="11" font-weight="400" fill="#92513c">Наблюдения</text><text x="496" y="634" font-family="Arial" font-size="29" font-weight="400" fill="#20251f">Красота простых вещей</text><text x="1196" y="632" font-family="Arial" font-size="20" font-weight="400" fill="#646c61">→</text><text x="496" y="673" font-family="Arial" font-size="14" font-weight="400" fill="#646c61">Ясность начинается с внимания к привычным деталям.</text><path d="M356 721h868" stroke="#dfe2d9"/><text x="356" y="770" font-family="Arial" font-size="12" font-weight="400" fill="#646c61">25.10.2026</text><text x="356" y="795" font-family="Arial" font-size="11" font-weight="400" fill="#92513c">Наблюдения</text><text x="496" y="774" font-family="Arial" font-size="29" font-weight="400" fill="#20251f">Как сохранить любопытство</text><text x="1196" y="772" font-family="Arial" font-size="20" font-weight="400" fill="#646c61">→</text><text x="496" y="813" font-family="Arial" font-size="14" font-weight="400" fill="#646c61"></text><path d="M356 861h868" stroke="#dfe2d9"/></svg>